# MLflow-стек лабы: метаданные в PostgreSQL, артефакты в S3-хранилище RustFS.
# Наружу опубликован только интерфейс MLflow: http://localhost:5050
name: lab

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mlflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      retries: 10

  storage:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:9000/health | grep -q ok"]
      interval: 5s
      retries: 10

  mlflow:
    build: ./mlflow
    image: lab-mlflow:3.16.1
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://storage:9000
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: mlflow
    command:
      - sh
      - -c
      - >-
        python /create_bucket.py &&
        exec mlflow server
        --backend-store-uri postgresql://mlflow:${POSTGRES_PASSWORD}@postgres:5432/mlflow
        --artifacts-destination s3://mlflow
        --host 0.0.0.0 --port 5000
        --allowed-hosts mlflow:5000,localhost:*,127.0.0.1:*
    ports:
      - "127.0.0.1:5050:5000"

volumes:
  pgdata:
  s3data:
